name: Build and Push Image

on:
  workflow_run:
    workflows: [" Deploy resource_group, acr,acr_secret,key_vault"]
    types:
      - completed

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-1

      - name: Extract ACR and Key Vault Details
        run: |
          ACR_NAME=$(terraform output -raw acr_name)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Authenticate to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and Push Docker Image
        run: |
          docker build -t $ACR_NAME.azurecr.io/myapp:latest .
          docker push $ACR_NAME.azurecr.io/myapp:latest