        #  if [[ -z "$DOWNLOAD_URLS" || "$DOWNLOAD_URLS" == "null" ]]; then
         #   echo "❌ No Terraform Plan artifacts found!"
          #  exit 1
          #fi

          # Loop through all artifacts and download each one
          #echo "$DOWNLOAD_URLS" | jq -c '.[]' | while read -r artifact; do
           # NAME=$(echo "$artifact" | jq -r '.name')
           # URL=$(echo "$artifact" | jq -r '.url')

            #echo "Downloading artifact: $NAME from $URL"
            #curl -s -L -H "Authorization: token $GH_TOKEN" -o "$NAME.zip" "$URL"
            #unzip "$NAME.zip" -d "$NAME"
            #rm "$NAME.zip"
          #done
          #   
          #echo "✅ All Terraform Plan artifacts downloaded and extracted!"

      - name: Download All Artifacts from Last Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest successful run of build.yml
          RUN_ID=$(gh run list --workflow Build.yml --status completed --json databaseId --jq ".[0].databaseId")

          if [[ -z "$RUN_ID" ]]; then
            echo "❌ No previous workflow run found!"
            exit 1
          fi

          echo "Downloading ALL artifacts from run ID: $RUN_ID"
          gh run download $RUN_ID --dir ./downloaded-artifacts

          echo "✅ All artifacts downloaded successfully!"
          
      - name: Check Backend and tfvars Files
        run: |
          BACKEND_FILE="envs/${{ env.ENV }}/backend-${{ env.ENV }}.tfbackend"
          TFVARS_FILE="envs/${{ env.ENV }}/${{ env.ENV }}.tfvars"

          if [[ ! -f "$BACKEND_FILE" ]]; then
            echo "❌ Backend config file not found: $BACKEND_FILE"
            exit 1
          fi

          if [[ ! -f "$TFVARS_FILE" ]]; then
            echo "❌ tfvars file not found: $TFVARS_FILE"
            exit 1
          fi

          echo "✅ All required files exist."

      - name: Terraform Init
        env:
          ARM_USE_OIDC: true
        run: terraform init -backend-config="envs/${{ env.ENV }}/backend-${{ env.ENV }}.tfbackend"
        
        
      - name: Terraform Apply (Only Required Modules)
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          terraform apply -auto-approve ./downloaded-artifacts/terraform-plan-resource-group/tfplan_resource_group \
          && terraform apply -auto-approve ./downloaded-artifacts/terraform-plan-acr/tfplan_acr \
          && terraform apply -auto-approve ./downloaded-artifacts/terraform-plan-acr-secrets/tfplan_acr_secrets \
          && terraform apply -auto-approve ./downloaded-artifacts/terraform-plan-key-vault/tfplan_key_vault



      - name: Extract ACR & Key Vault Names from State
        run: |
          ACR_NAME=$(terraform output -raw acr_name)
          KEY_VAULT_NAME=$(terraform output -raw key_vault_name)
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "KEY_VAULT_NAME=$KEY_VAULT_NAME" >> $GITHUB_ENV

      - name: Upload Terraform Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-1
          path: tfplan
          retention-days: 5  # Retain for 5 day to prevent clutter
