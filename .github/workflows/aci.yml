
      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download All Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow "Deploy resource_group, acr,acr_secret,key_vault" --status completed --json databaseId --jq ".[0].databaseId")
          
          if [[ -z "$RUN_ID" ]]; then
            echo "❌ No previous workflow run found!"
            exit 1
          fi
          
          echo "Downloading ALL artifacts from run ID: $RUN_ID"
          gh run download $RUN_ID --dir ./downloaded-artifacts
          echo "✅ All artifacts downloaded successfully!"

      - name: Check Backend and tfvars Files
        run: |
          BACKEND_FILE="envs/${{ env.ENV }}/backend-${{ env.ENV }}.tfbackend"
          TFVARS_FILE="envs/${{ env.ENV }}/${{ env.ENV }}.tfvars"

          if [[ ! -f "$BACKEND_FILE" ]]; then
            echo "❌ Backend config file not found: $BACKEND_FILE"
            exit 1
          fi

          if [[ ! -f "$TFVARS_FILE" ]]; then
            echo "❌ tfvars file not found: $TFVARS_FILE"
            exit 1
          fi

          echo "✅ All required files exist."

      - name: Terraform Init
        env:
          ARM_USE_OIDC: true
        run: terraform init -backend-config="envs/${{ env.ENV }}/backend-${{ env.ENV }}.tfbackend"

      - name: Extract ACR & ACI Details
        run: |
          ACR_NAME=$(terraform output -raw acr_name 2>/dev/null || echo "")
          ACI_NAME=$(terraform output -raw aci_name 2>/dev/null || echo "")
          RESOURCE_GROUP=$(terraform output -raw resource_group_name 2>/dev/null || echo "")
          
          if [[ -z "$ACR_NAME" || -z "$ACI_NAME" || -z "$RESOURCE_GROUP" ]]; then
            echo "❌ Failed to retrieve Terraform outputs!"
            exit 1
          fi

          echo "✅ ACR: $ACR_NAME, ACI: $ACI_NAME"
          echo "ACR_NAME=$ACR_NAME" >> $GITHUB_ENV
          echo "ACI_NAME=$ACI_NAME" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$RESOURCE_GROUP" >> $GITHUB_ENV

      - name: Run Terraform Plan for ACI
        run: terraform plan -var-file="envs/${{ env.ENV }}/${{ env.ENV }}.tfvars" -target=module.aci

      - name: Deploy ACI with Terraform
        run: terraform apply -auto-approve -var-file="envs/${{ env.ENV }}/${{ env.ENV }}.tfvars"

      - name: Verify ACI Deployment
        run: |
          STATUS=$(az container show --name $ACI_NAME --resource-group $RESOURCE_GROUP --query "instanceView.state" -o tsv)
          echo "ACI Deployment Status: $STATUS"